<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Modeler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; overflow: hidden; height: 100dvh; height: 100vh; display: flex; flex-direction: column; }

    #top-bar {
      display: flex; align-items: center; gap: 6px; padding: 6px 10px;
      background: #16213e; border-bottom: 1px solid #0f3460; flex-shrink: 0; z-index: 10;
    }
    #top-bar h1 { font-size: 15px; color: #e94560; white-space: nowrap; }
    #add-btns { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
    .add-btn {
      padding: 5px 8px; border: 1px solid #0f3460; background: #1a1a2e; color: #e0e0e0;
      border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; touch-action: manipulation;
    }
    .add-btn:hover, .add-btn:active { background: #e94560; border-color: #e94560; }

    #main { display: flex; flex: 1; overflow: hidden; position: relative; }

    #viewport { flex: 1; position: relative; min-width: 0; }
    #viewport canvas { display: block; width: 100% !important; height: 100% !important; }

    #toolbar {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 3px; background: #16213e; padding: 3px; border-radius: 6px;
      border: 1px solid #0f3460; z-index: 5;
    }
    .tool-btn {
      padding: 5px 10px; background: transparent; border: none; color: #e0e0e0;
      border-radius: 3px; cursor: pointer; font-size: 12px; touch-action: manipulation;
    }
    .tool-btn:hover { background: #0f3460; }
    .tool-btn.active { background: #e94560; }

    #space-btn {
      position: absolute; top: 10px; right: 10px;
      padding: 5px 10px; background: #16213e; border: 1px solid #0f3460;
      color: #e0e0e0; border-radius: 4px; cursor: pointer; font-size: 12px; z-index: 5;
      touch-action: manipulation;
    }
    #space-btn:hover { background: #0f3460; }
    #space-btn.local { background: #e94560; border-color: #e94560; }

    #sidebar {
      width: 220px; min-width: 220px; background: #16213e; padding: 10px;
      display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
      border-left: 1px solid #0f3460;
    }
    #sidebar h2 { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }

    #object-list { display: flex; flex-direction: column; gap: 2px; }
    .obj-item {
      padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
      display: flex; justify-content: space-between; align-items: center; background: #1a1a2e;
      touch-action: manipulation;
    }
    .obj-item:hover { background: #0f3460; }
    .obj-item.selected { background: #e94560; color: #fff; }
    .obj-item .delete-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 14px; padding: 0 2px; }
    .obj-item .delete-btn:hover { color: #fff; }

    #props-panel { display: flex; flex-direction: column; gap: 6px; }
    .prop-row { display: flex; flex-direction: column; gap: 2px; }
    .prop-row label { font-size: 11px; color: #888; }
    .prop-row input[type="number"],
    .prop-row input[type="range"] {
      width: 100%; padding: 4px 6px; background: #1a1a2e; border: 1px solid #0f3460;
      color: #e0e0e0; border-radius: 4px; font-size: 12px;
    }
    .prop-row input[type="range"] { padding: 0; }
    .range-val { display: flex; justify-content: space-between; font-size: 10px; color: #666; }

    #no-selection { color: #555; font-size: 12px; text-align: center; padding: 16px 0; }

    /* Mobile: sidebar as bottom panel */
    #sidebar-toggle {
      display: none; position: absolute; bottom: 10px; right: 10px; z-index: 20;
      padding: 8px 12px; background: #e94560; border: none; color: #fff;
      border-radius: 6px; font-size: 13px; cursor: pointer; touch-action: manipulation;
    }

    @media (max-width: 700px) {
      body { flex-direction: column; }
      #main { flex-direction: column-reverse; }
      #sidebar {
        width: 100%; min-width: 0; max-height: 40dvh; border-left: none;
        border-top: 1px solid #0f3460; display: none;
      }
      #sidebar.open { display: flex; }
      #sidebar-toggle { display: block; }
      #top-bar { padding: 4px 8px; gap: 4px; }
      #top-bar h1 { font-size: 13px; }
      .add-btn { padding: 4px 6px; font-size: 11px; }
      #toolbar { top: 6px; padding: 2px; gap: 2px; }
      .tool-btn { padding: 4px 8px; font-size: 11px; }
      #space-btn { top: 6px; font-size: 11px; padding: 4px 8px; }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="top-bar">
    <h1>3D Modeler</h1>
    <div id="add-btns">
      <button class="add-btn" data-type="cube">Cube</button>
      <button class="add-btn" data-type="sphere">Sphere</button>
      <button class="add-btn" data-type="cylinder">Cylinder</button>
      <button class="add-btn" data-type="plane">Plane</button>
    </div>
  </div>

  <div id="main">
    <div id="sidebar">
      <h2>Scene Objects</h2>
      <div id="object-list"></div>

      <h2>Properties</h2>
      <div id="props-panel">
        <div id="no-selection">Tap an object to edit</div>
        <div id="props-content" style="display:none;"></div>
      </div>
    </div>

    <div id="viewport">
      <div id="toolbar">
        <button class="tool-btn active" data-mode="translate" title="Move">Move</button>
        <button class="tool-btn" data-mode="rotate" title="Rotate">Rotate</button>
        <button class="tool-btn" data-mode="scale" title="Scale">Scale</button>
      </div>
      <button id="space-btn">World</button>
      <button id="sidebar-toggle">Objects</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // ─── Scene ───
    const viewport = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(50, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(8, 6, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    viewport.appendChild(renderer.domElement);

    // ─── Lighting ───
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(8, 12, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;
    scene.add(dirLight);
    scene.add(new THREE.HemisphereLight(0x8888ff, 0x444422, 0.3));

    // ─── Ground ───
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.ShadowMaterial({ opacity: 0.3 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    // ─── Gizmo (axis indicator in corner) ───
    const gizmoScene = new THREE.Scene();
    const gizmoCamera = new THREE.OrthographicCamera(-1.5, 1.5, 1.5, -1.5, 0.1, 10);
    gizmoCamera.position.set(0, 0, 3);
    gizmoScene.add(new THREE.AmbientLight(0xffffff, 1));

    const gizmoGroup = new THREE.Group();
    gizmoScene.add(gizmoGroup);

    const gizmoLen = 1;
    function makeAxis(color, dir) {
      const mat = new THREE.LineBasicMaterial({ color, linewidth: 2 });
      const pts = [new THREE.Vector3(0, 0, 0), dir.clone().multiplyScalar(gizmoLen)];
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const line = new THREE.Line(geo, mat);
      // endpoint sphere
      const sph = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 8, 8),
        new THREE.MeshBasicMaterial({ color })
      );
      sph.position.copy(dir).multiplyScalar(gizmoLen);
      gizmoGroup.add(line, sph);
    }
    makeAxis(0xe94560, new THREE.Vector3(1, 0, 0)); // X
    makeAxis(0x4a7c59, new THREE.Vector3(0, 1, 0)); // Y
    makeAxis(0x0f3460, new THREE.Vector3(0, 0, 1)); // Z

    // Axis labels
    function makeLabel(text, color, pos) {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = color;
      ctx.font = 'bold 48px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 32, 32);
      const tex = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.position.copy(pos).multiplyScalar(1.3);
      sprite.scale.set(0.4, 0.4, 0.4);
      gizmoGroup.add(sprite);
    }
    makeLabel('X', '#e94560', new THREE.Vector3(1, 0, 0));
    makeLabel('Y', '#4a7c59', new THREE.Vector3(0, 1, 0));
    makeLabel('Z', '#0f3460', new THREE.Vector3(0, 0, 1));

    // ─── Controls ───
    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.08;
    orbitControls.target.set(0, 0, 0);

    const transformControls = new TransformControls(camera, renderer.domElement);
    transformControls.addEventListener('dragging-changed', e => { orbitControls.enabled = !e.value; });
    transformControls.addEventListener('objectChange', () => { if (selectedObject) updatePropsPanel(); });
    scene.add(transformControls.getHelper());

    // ─── State ───
    let objects = [];
    let selectedObject = null;
    let transformMode = 'translate';
    let transformSpace = 'world';
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let idCounter = 0;

    // ─── Defaults ───
    const DEFAULTS = {
      cube:     { color: 0xe94560, width: 1, height: 1, depth: 1 },
      sphere:   { color: 0x53a8b6, radius: 0.6, widthSegments: 32, heightSegments: 16 },
      cylinder: { color: 0x0f3460, radiusTop: 0.5, radiusBottom: 0.5, height: 1, radialSegments: 16, heightSegments: 1 },
      plane:    { color: 0x4a7c59, width: 2, height: 2 },
    };

    // ─── Geometry ───
    function buildGeometry(type, props) {
      switch (type) {
        case 'cube':     return new THREE.BoxGeometry(props.width, props.height, props.depth);
        case 'sphere':   return new THREE.SphereGeometry(props.radius, props.widthSegments, props.heightSegments);
        case 'cylinder': return new THREE.CylinderGeometry(props.radiusTop, props.radiusBottom, props.height, props.radialSegments, props.heightSegments);
        case 'plane':    return new THREE.PlaneGeometry(props.width, props.height);
      }
    }

    function createObject(type) {
      const d = DEFAULTS[type];
      const props = {};
      for (const [k, v] of Object.entries(d)) { if (k !== 'color') props[k] = v; }

      const mesh = new THREE.Mesh(
        buildGeometry(type, props),
        new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.5, metalness: 0.1 })
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      const name = `${type.charAt(0).toUpperCase() + type.slice(1)} ${++idCounter}`;
      mesh.userData = { name, type, props };

      if (type === 'plane') { mesh.rotation.x = -Math.PI / 2; mesh.position.y = 0.01; }
      else { mesh.position.y = props.height ? props.height / 2 : props.radius || 0.5; }

      scene.add(mesh);
      objects.push(mesh);
      selectObject(mesh);
      refreshObjectList();
    }

    function updateGeometry(mesh) {
      const { type, props } = mesh.userData;
      mesh.geometry.dispose();
      mesh.geometry = buildGeometry(type, props);
    }

    // ─── Selection ───
    function selectObject(mesh) {
      selectedObject = mesh;
      transformControls.attach(mesh);
      refreshObjectList();
      updatePropsPanel();
    }

    function deselectAll() {
      selectedObject = null;
      transformControls.detach();
      refreshObjectList();
      updatePropsPanel();
    }

    // ─── Object List ───
    function refreshObjectList() {
      const list = document.getElementById('object-list');
      list.innerHTML = '';
      for (const obj of objects) {
        const item = document.createElement('div');
        item.className = 'obj-item' + (obj === selectedObject ? ' selected' : '');
        const label = document.createElement('span');
        label.textContent = obj.userData.name;
        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '\u00d7';
        del.addEventListener('click', e => { e.stopPropagation(); removeObject(obj); });
        item.appendChild(label);
        item.appendChild(del);
        item.addEventListener('click', () => selectObject(obj));
        list.appendChild(item);
      }
    }

    function removeObject(mesh) {
      scene.remove(mesh);
      mesh.geometry.dispose();
      mesh.material.dispose();
      objects = objects.filter(o => o !== mesh);
      if (selectedObject === mesh) deselectAll();
      refreshObjectList();
    }

    // ─── Properties ───
    function updatePropsPanel() {
      const noSel = document.getElementById('no-selection');
      const content = document.getElementById('props-content');
      if (!selectedObject) { noSel.style.display = ''; content.style.display = 'none'; return; }
      noSel.style.display = 'none'; content.style.display = '';
      content.innerHTML = '';

      const { type, props, name } = selectedObject.userData;

      // Name
      const nameRow = document.createElement('div');
      nameRow.className = 'prop-row';
      nameRow.innerHTML = '<label>Name</label>';
      const nameInput = document.createElement('input');
      nameInput.type = 'text'; nameInput.value = name;
      nameInput.style.cssText = 'width:100%;padding:4px 6px;background:#1a1a2e;border:1px solid #0f3460;color:#e0e0e0;border-radius:4px;font-size:12px;';
      nameInput.addEventListener('input', () => { selectedObject.userData.name = nameInput.value; refreshObjectList(); });
      nameRow.appendChild(nameInput);
      content.appendChild(nameRow);

      // Type props
      for (const def of getPropertyDefs(type)) {
        const row = document.createElement('div');
        row.className = 'prop-row';
        const val = props[def.key];
        if (def.type === 'range') {
          const rv = document.createElement('div');
          rv.className = 'range-val';
          rv.innerHTML = `<span>${def.label}</span><span>${val}</span>`;
          row.appendChild(rv);
          const input = document.createElement('input');
          input.type = 'range'; input.min = def.min; input.max = def.max; input.step = 1; input.value = val;
          input.addEventListener('input', () => {
            const v = parseInt(input.value);
            props[def.key] = v;
            rv.querySelector('span:last-child').textContent = v;
            updateGeometry(selectedObject);
            if (def.affectsY) recenterY(selectedObject);
          });
          row.appendChild(input);
        } else {
          row.innerHTML = `<label>${def.label}</label>`;
          const input = document.createElement('input');
          input.type = 'number'; input.value = val; input.min = def.min; input.step = def.step || 0.1;
          input.addEventListener('input', () => {
            const v = parseFloat(input.value);
            if (isNaN(v) || v <= 0) return;
            props[def.key] = v;
            updateGeometry(selectedObject);
            if (def.affectsY) recenterY(selectedObject);
          });
          row.appendChild(input);
        }
        content.appendChild(row);
      }

      // Position
      appendSection(content, 'Position', ['x', 'y', 'z'], selectedObject.position, v => v, v => v);

      // Rotation
      appendSection(content, 'Rotation (deg)', ['x', 'y', 'z'], selectedObject.rotation,
        v => THREE.MathUtils.radToDeg(v).toFixed(1),
        v => THREE.MathUtils.degToRad(parseFloat(v) || 0));
    }

    function appendSection(container, title, axes, target, displayFn, parseFn) {
      const head = document.createElement('div');
      head.innerHTML = `<h2 style="font-size:11px;color:#e94560;margin-top:6px;">${title}</h2>`;
      container.appendChild(head);
      for (const axis of axes) {
        const row = document.createElement('div');
        row.className = 'prop-row';
        row.innerHTML = `<label>${axis.toUpperCase()}</label>`;
        const input = document.createElement('input');
        input.type = 'number'; input.value = displayFn(target[axis]); input.step = 0.25;
        input.addEventListener('input', () => { target[axis] = parseFn(input.value); });
        row.appendChild(input);
        container.appendChild(row);
      }
    }

    function recenterY(mesh) {
      const { type, props } = mesh.userData;
      if (type === 'cube' || type === 'cylinder') mesh.position.y = props.height / 2;
      else if (type === 'sphere') mesh.position.y = props.radius;
    }

    function getPropertyDefs(type) {
      switch (type) {
        case 'cube': return [
          { key: 'width', label: 'Width', type: 'number', min: 0.1, step: 0.1 },
          { key: 'height', label: 'Height', type: 'number', min: 0.1, step: 0.1, affectsY: true },
          { key: 'depth', label: 'Depth', type: 'number', min: 0.1, step: 0.1 },
        ];
        case 'sphere': return [
          { key: 'radius', label: 'Radius', type: 'number', min: 0.1, step: 0.1, affectsY: true },
          { key: 'widthSegments', label: 'Width Segments', type: 'range', min: 3, max: 64 },
          { key: 'heightSegments', label: 'Height Segments', type: 'range', min: 2, max: 32 },
        ];
        case 'cylinder': return [
          { key: 'radiusTop', label: 'Radius Top', type: 'number', min: 0, step: 0.1 },
          { key: 'radiusBottom', label: 'Radius Bottom', type: 'number', min: 0, step: 0.1 },
          { key: 'height', label: 'Height', type: 'number', min: 0.1, step: 0.1, affectsY: true },
          { key: 'radialSegments', label: 'Radial Segments', type: 'range', min: 3, max: 32 },
          { key: 'heightSegments', label: 'Height Segments', type: 'range', min: 1, max: 16 },
        ];
        case 'plane': return [
          { key: 'width', label: 'Width', type: 'number', min: 0.1, step: 0.1 },
          { key: 'height', label: 'Height', type: 'number', min: 0.1, step: 0.1 },
        ];
      }
    }

    // ─── Events ───
    document.querySelectorAll('.add-btn').forEach(btn => {
      btn.addEventListener('click', () => createObject(btn.dataset.type));
    });

    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        transformMode = btn.dataset.mode;
        transformControls.setMode(transformMode);
      });
    });

    // Space toggle (World / Local)
    const spaceBtn = document.getElementById('space-btn');
    spaceBtn.addEventListener('click', () => {
      transformSpace = transformSpace === 'world' ? 'local' : 'world';
      transformControls.setSpace(transformSpace);
      spaceBtn.textContent = transformSpace === 'world' ? 'World' : 'Local';
      spaceBtn.classList.toggle('local', transformSpace === 'local');
    });

    // Mobile sidebar toggle
    const sidebar = document.getElementById('sidebar');
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // Select / deselect
    renderer.domElement.addEventListener('pointerdown', e => {
      if (transformControls.dragging) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(objects);
      if (hits.length > 0) selectObject(hits[0].object);
      else deselectAll();
    });

    // Keyboard
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      switch (e.key.toLowerCase()) {
        case 'g': document.querySelector('[data-mode="translate"]').click(); break;
        case 'r': document.querySelector('[data-mode="rotate"]').click(); break;
        case 's': document.querySelector('[data-mode="scale"]').click(); break;
        case 'delete': case 'backspace': if (selectedObject) removeObject(selectedObject); break;
        case 'escape': deselectAll(); break;
        case 't': spaceBtn.click(); break;
      }
    });

    // Resize
    const ro = new ResizeObserver(() => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });
    ro.observe(viewport);

    // ─── Render Loop ───
    (function animate() {
      requestAnimationFrame(animate);
      orbitControls.update();

      // Render main scene
      renderer.render(scene, camera);

      // Render gizmo in corner
      const s = Math.min(viewport.clientWidth, viewport.clientHeight) * 0.18;
      const gx = viewport.clientWidth - s - 10;
      const gy = 10;
      renderer.clearDepth();
      renderer.setViewport(gx, gy, s, s);
      renderer.setScissor(gx, gy, s, s);
      renderer.setScissorTest(true);

      // Sync gizmo rotation with main camera
      gizmoGroup.quaternion.copy(camera.quaternion);

      renderer.render(gizmoScene, gizmoCamera);
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, viewport.clientWidth, viewport.clientHeight);
    })();
  </script>
</body>
</html>
